name: Deploy Porulon Technologies

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e

            echo "========================================="
            echo " PORULON DEPLOYMENT STARTED"
            echo "========================================="

            cd /var/www/porulontech

            echo "[1/7] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/7] Creating backend environment..."

            cat > backend/.env <<EOF
            PORT=5007
            PG_HOST=${{ secrets.PG_HOST }}
            PG_PORT=${{ secrets.PG_PORT }}
            PG_USER=${{ secrets.PG_USER }}
            PG_PASSWORD=${{ secrets.PG_PASSWORD }}
            PG_DB=${{ secrets.PG_DB }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            NODE_ENV=production
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
            RESEND_ADMIN_EMAIL=${{ secrets.RESEND_ADMIN_EMAIL }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            EOF

            echo "[3/7] Installing backend..."
            cd /var/www/porulontech/backend
            npm install --production

            echo "[4/7] Building frontend..."
            cd /var/www/porulontech/frontend
            npm install
            npm run build

            echo "[5/7] Building admin..."
            cd /var/www/porulontech/admin
            npm install
            npm run build

            echo "[6/7] Starting backend..."

            cd /var/www/porulontech/backend

            pm2 delete porulon-backend 2>/dev/null || true
            pm2 start src/server.js --name porulon-backend
            pm2 save

            echo "Waiting for backend..."
            sleep 5

            echo "Testing backend..."
            curl -f http://127.0.0.1:5007/api/health

            echo ""
            echo "[7/7] Testing Nginx..."

            nginx -t
            systemctl reload nginx

            echo "========================================="
            echo " PORULON DEPLOYMENT COMPLETED"
            echo "========================================="