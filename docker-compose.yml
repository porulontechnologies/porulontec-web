version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: porulonstack_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: porulonstack
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: porulonstack_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/porulonstack
      JWT_SECRET: porulonstack_super_secret_jwt_key_2026
      NODE_ENV: production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: porulonstack_frontend
    restart: always
    ports:
      - "5175:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: porulonstack_admin
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mongo_data:
